[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumes-ranker"
version = "1.0.0"
description = "Rank resumes against weighted job criteria with TypeSafe Jev via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "rich>=13.0",  # prettier CLI tables; the CLI works without it
]

[project.scripts]
# Interactive tester
resume-ranker = "app.cli:main"
# HTTP API server
resume-ranker-api = "app.main:main"
# Local fake Decisions API, for testing without credit
resume-ranker-mock = "app.testing:serve"

[tool.hatch.build.targets.wheel]
# "app" pulls in app.api, app.schemas, and app.services with it.
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "README.md", "pyproject.toml"]
